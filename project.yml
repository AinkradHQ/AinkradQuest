name: AinkradQuest
options:
  bundleIdPrefix: com.ainkrad
  deploymentTarget: { macOS: "14.0" }
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGNING_ALLOWED: NO
    EAGER_LINKING: NO
packages:
  AinkradAppKit:
    url: https://github.com/AinkradHQ/AinkradAppKit
    # Must NEVER be ahead of the revision the host's build checks out. Read the
    # truth from the host, never from this comment:
    #   git -C ../Ainkrad/build/SourcePackages/checkouts/AinkradAppKit rev-parse HEAD
    #
    # This comment used to demand an EXACT match, "not merely <=". That was
    # wrong, and wrong in a way that made it unfollowable: the host advances its
    # pin whenever the SDK gains something it needs, and every plugin lags until
    # it has a reason to move. As of 2026-09-05 no plugin matched the host
    # exactly and none had for weeks.
    #
    # But do not read "not ahead" as "behind is safe". It is not. The host
    # embeds the ONE dynamic copy of the SDK, and this plugin links whatever
    # mangled symbols its OWN revision declared. Two ways that ends badly:
    #
    #   ahead  — links symbols the host's older copy never defined. Always dead.
    #   behind — fine ONLY while every symbol it linked still exists in the
    #            host's newer copy. Removing a public declaration breaks that,
    #            and so does merely adding a defaulted parameter to an existing
    #            one, because that re-mangles the symbol. See the history below:
    #            that failure was a pin BEHIND the host.
    #
    # So the rule is: at or behind the host, AND no public symbol removed or
    # re-mangled in between. `make abi-check` in the SDK is what guards the
    # second half — note it baselines only AinkradAppKitContract and
    # AinkradSignal, so a change in AinkradAppKitUI needs checking by hand:
    #   git -C ../AinkradAppKit diff <thisPin>..<hostPin> -- Sources \
    #     | grep -E '^[-+].*\b(public|open)\b'
    #
    # Source compiles either way. Only linking tells the truth, so the real
    # check is loading the built bundle into the host and confirming it:
    #   lsof -p $(pgrep -f Ainkrad.app/Contents/MacOS/Ainkrad) | grep Plugin.bundle
    #
    # History, kept as an example of what "close enough" costs: an earlier pin,
    # d5d994b (one day older than 98cb823), built and tested fine but died at
    # `Bundle.load()` — `AinkradFormRow`'s init gained defaulted parameters in
    # 98cb823, so the mangled symbol Quest linked against
    # (`init(title:help:control:)`) no longer existed in the framework the host
    # embedded. Source compiled either way — only linking told the truth. That
    # is the failure mode this comment exists to prevent recurring.
    revision: 7bb80e9f1d01d468949f6c776dd111c9d6b8d690
targets:
  QuestFeature:
    type: library.static
    platform: macOS
    sources: [Sources/QuestFeature]
    dependencies:
      - package: AinkradAppKit
        embed: false
  QuestPlugin:
    type: bundle
    platform: macOS
    sources: [Sources/QuestPlugin]
    postBuildScripts:
      # Generate AinkradAPIVersion from the SDK this build linked,
      # rather than trusting the hand-typed Info.plist value.
      - script: '"$SRCROOT/scripts/stamp-api-version.sh"'
        name: Stamp AinkradAPIVersion
        # The plist is an INPUT, not an output: declaring it makes the build
        # system order this phase after the task that copies it into the
        # bundle. Without it the script races that copy and finds nothing.
        inputFiles:
          - $(TARGET_BUILD_DIR)/$(INFOPLIST_PATH)
        # No outputs, so keep it running every build: the linked SDK revision
        # can change generation without any source file changing.
        basedOnDependencyAnalysis: false
    dependencies:
      - target: QuestFeature
      - package: AinkradAppKit
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ainkrad.plugin.quest
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Sources/QuestPlugin/Info.plist
        MACH_O_TYPE: mh_bundle
        LD_RUNPATH_SEARCH_PATHS: "@executable_path/../Frameworks"
        OTHER_LDFLAGS: ["-lQuestFeature"]
  QuestFeatureTests:
    type: bundle.unit-test
    platform: macOS
    sources: [Tests/QuestFeatureTests]
    dependencies:
      - target: QuestFeature
      - package: AinkradAppKit
schemes:
  QuestPlugin:
    build: { targets: { QuestPlugin: all, QuestFeatureTests: [test] } }
    test:  { config: Debug, targets: [QuestFeatureTests] }
